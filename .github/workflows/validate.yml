name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_runtime:
        description: "从官方 npm 验证真实自动安装，不调用模型或业务系统"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: node --test tests/runtime.test.mjs

  live-runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.live_runtime
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - run: node skills/software-dev-team/scripts/maestro-runtime.mjs ensure --cache-root .runtime-cache
      - run: node skills/software-dev-team/scripts/maestro-runtime.mjs ensure --cache-root .runtime-cache --offline
